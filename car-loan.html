<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Loan EMI Calculator - LoanMitraCalc</title>

    <meta name="description" content="Calculate Car Loan EMI, total interest and total repayment amount easily with LoanMitraCalc's free Car Loan EMI Calculator.">

    <meta name="keywords" content="car loan calculator, car loan EMI calculator, auto loan calculator, EMI calculator, car loan interest calculator">

    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://loanmitracalc.github.io/loanmitracalc/car-loan.html">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #0d47a1;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .calculator {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #0d47a1;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #08306b;
        }

        .results {
            margin-top: 25px;
            display: grid;
            gap: 12px;
        }

        .result-box {
            background: #eef4ff;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
        }

        .result-box h3 {
            margin: 0 0 8px;
            color: #0d47a1;
        }

        .result-box p {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #0d47a1;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>LoanMitraCalc</h1>
</header>

<div class="container">

    <div class="calculator">

        <h2>Car Loan EMI Calculator</h2>

        <label>Car Loan Amount (₹)</label>
        <input type="number" id="loanAmount" placeholder="Example: 800000">

        <label>Interest Rate (% per year)</label>
        <input type="number" id="interestRate" placeholder="Example: 9">

        <label>Loan Tenure (Years)</label>
        <input type="number" id="loanTenure" placeholder="Example: 5">

        <button onclick="calculateEMI()">Calculate EMI</button>

        <div class="results">

            <div class="result-box">
                <h3>Monthly EMI</h3>
                <p id="emi">₹0.00</p>
            </div>

            <div class="result-box">
                <h3>Total Interest</h3>
                <p id="totalInterest">₹0.00</p>
            </div>

            <div class="result-box">
                <h3>Total Payment</h3>
                <p id="totalPayment">₹0.00</p>
            </div>

        </div>

        <a class="back" href="index.html">← Back to Home</a>

    </div>

</div>

<footer>
    © 2026 LoanMitraCalc. All Rights Reserved.
</footer>

<script>

function calculateEMI() {

    let principal = parseFloat(document.getElementById("loanAmount").value);
    let annualRate = parseFloat(document.getElementById("interestRate").value);
    let years = parseFloat(document.getElementById("loanTenure").value);

    if (
        isNaN(principal) ||
        isNaN(annualRate) ||
        isNaN(years) ||
        principal <= 0 ||
        annualRate < 0 ||
        years <= 0
    ) {
        alert("Please enter valid loan details.");
        return;
    }

    let months = years * 12;
    let monthlyRate = annualRate / 12 / 100;

    let emi;

    if (monthlyRate === 0) {
        emi = principal / months;
    } else {
        emi =
            principal *
            monthlyRate *
            Math.pow(1 + monthlyRate, months) /
            (Math.pow(1 + monthlyRate, months) - 1);
    }

    let totalPayment = emi * months;
    let totalInterest = totalPayment - principal;

    document.getElementById("emi").innerText =
        "₹" + emi.toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

    document.getElementById("totalInterest").innerText =
        "₹" + totalInterest.toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

    document.getElementById("totalPayment").innerText =
        "₹" + totalPayment.toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
}

</script>

</body>
</html>
